[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talon"
version = "1.0.0"
description = "Citadel collector (Talon), endpoint artifact collection"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
    { name = "Citadel" },
]
# runtime deps tracked in requirements-build.txt
dependencies = []

[project.scripts]
talon = "collect:main"

# Flat layout: seven top-level modules, no package directory. setuptools refuses
# to guess ("Multiple top-level modules discovered in a flat-layout"), so they
# are listed explicitly. `collect` is the console-script entry point.
[tool.setuptools]
py-modules = [
    "agent_client",
    "artifact_collector",
    "collect",
    "collector_server",
    "crypto",
    "fo_uploader",
    "secure_upload",
]
